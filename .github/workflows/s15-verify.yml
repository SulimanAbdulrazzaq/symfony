name: s15-verify-php-matrix
on: push
jobs:
  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - run: git log -3 --format='%H %T %s'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, xml, ctype, curl, dom, libxml, iconv, zip
          tools: composer
      - name: composer update (monorepo root)
        env:
          COMPOSER_ROOT_VERSION: 6.4.x-dev
        run: composer update --no-interaction --no-progress --prefer-dist --ignore-platform-reqs 2>&1 | tail -3
      - run: php -v | head -1
      - name: Yaml component tests
        run: ./phpunit src/Symfony/Component/Yaml --colors=never
