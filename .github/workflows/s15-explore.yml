name: s15-yaml-parse-fuzz
on: push
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            src/Symfony/Component/Yaml
      - run: git log -3 --format='%H %T %s'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: install Yaml component dependencies
        working-directory: src/Symfony/Component/Yaml
        run: composer install --no-interaction --no-progress
      - name: parse fuzz seed 1
        working-directory: src/Symfony/Component/Yaml
        run: php yaml_parse_fuzz.php 1 400000
      - name: parse fuzz seed 2
        if: always()
        working-directory: src/Symfony/Component/Yaml
        run: php yaml_parse_fuzz.php 2 400000
      - name: parse fuzz seed 3
        if: always()
        working-directory: src/Symfony/Component/Yaml
        run: php yaml_parse_fuzz.php 3 400000
