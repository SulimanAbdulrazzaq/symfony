name: s15-sf-fuzz
on: push
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: tree under test
        run: git log -3 --format='%H %T %s'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, xml, ctype, curl, dom, libxml, iconv, ldap, zip
      - name: composer update (monorepo root)
        env:
          COMPOSER_ROOT_VERSION: 8.2.x-dev
        run: composer update --no-interaction --no-progress --prefer-dist --ignore-platform-reqs 2>&1 | tail -8
      - name: fuzz seed 1
        run: php sf_fuzz.php 1 2500
      - name: fuzz seed 2
        if: always()
        run: php sf_fuzz.php 2 2500
